spring:
  application:
    name: customer-management-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer_management}
    database: ${MONGODB_DATABASE:customer_management}
    representation:
      uuid: standard
  data:
    mongodb:
        auto-index-creation: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 5
  
########################################
# Server startup.
# This is the code block to start the server.
########################################
server:
  port: 8083
  servlet:
    context-path: /customer-management

########################################
# API versioning: This section contains the versioning
# for the API. Also, there are some other contents related
# to the API. 
########################################
api:
  version: v1 
  customer:
    basePath: /api/${api.version}/customers

########################################
# Outbox versioning
########################################
outbox:
  pollIntervalMs: 2000
  batchSize: 50
  maxRetries: 10

########################################
# Jackson versioning
########################################
jackson:
  serialization:
    writeDatesAsTimestamps: false
    writeDatesWithZoneId: false
    prettyPrint: false
    failOnEmptyBeans: true
  deserialization:
    failOnUnknownProperties: true
    acceptEmptyStringAsNull: false
    acceptSingleValueAsArray: false
    readUnknownEnumValuesAsNull: false
  inclusion:
    value: NON_NULL
    nullValueHandling: SET
    content: ALWAYS
  naming:
    strategy: LOWER_CAMEL_CASE


########################################
# HTTP versioning for requests
########################################
http:
  enabled: true 
  connectTimeoutMs: 3000
  readTimeoutMs: 5000
  retry:
    enabled: true 
    maxAttempts: 3
    initialIntervalMs: 500
    multiplier: 2
    maxIntervalMs: 5000
  headers:
    propagateCorrelationId: true 
    propagateTraceId: true
    correlationHeader: X-Correlation-Id
    traceHeader: X-Trace-Id
    userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

########################################
# MDC configuration
########################################
mdc:
  enabled: true 
  correlation:
    header: X-Correlation-Id 
    mdcKey: correlationId 
    acceptIncoming: true 
    generateIfMissing: true
  trace:
    header: X-Trace-Id 
    mdcKey: traceId 
    acceptIncoming: true 
    generateIfMissing: true
  response:
    includeCorrelationId: true 
    includeTraceId: true
  validation:
    maxIdLength: 128

########################################
# Request logging filter configuration
########################################
requestLogging: 
  enabled: true 
  includeQueryString: true 
  includeCorrelationId: true 
  includeTraceId: true 
  includeDuration: true 

logging:
  level:
    root: INFO
    com.loan_org.customer_management: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.amqp: INFO

info:
  app:
    name: Customer Management Service
    description: Customer lifecycle and profile management service
    version: 0.0.1

# Event configuration (RabbitMQ for now)
event:
  rabbitmq:
    enabled: true
    exchange:
      name: customer.events
      type: topic
      durable: true
      auto-delete: false
    customer-events:
      name: customer.events.queue
      durable: true
      exclusive: false
      auto-delete: false
      routing-key: customer.*
    publisher:
      enabled: true
      confirms: true
      returns: true
    consumer:
      enabled: false
      concurrency: 1
      max-concurrency: 5
      prefetch: 10
      acknowledgement-mode: manual
    retry:
      enabled: true
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
      dead-letter-enabled: true
      dead-letter-exchange: customer.events.dlx
      dead-letter-queue: customer.events.dlq

# External client configuration
external:
  pincode:
    requestUrl: https://api.postalpincode.in/pincode