spring:
  application:
    name: customer-management-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer_management}
    database: ${MONGODB_DATABASE:customer_management}
    representation:
      uuid: standard
  data:
    mongodb:
        auto-index-creation: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 5
  
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /customer-management

logging:
  level:
    root: INFO
    com.loan_org.customer_management: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.amqp: INFO

info:
  app:
    name: Customer Management Service
    description: Customer lifecycle and profile management service
    version: 0.0.1

# Application configuration 
config:
  http: # HTTP configuration here
    enabled: true 
    connectTimeoutMs: 3000
    readTimeoutMs: 5000
    writeTimeoutMs: 5000
    maxInMemorySizeMb: 10
    retry:
      enabled: true 
      maxAttempts: 3
      initialIntervalMs: 500
      multiplier: 2
      maxIntervalMs: 5000
    headers:
      propagateCorrelationId: true 
      propagateTraceId: true
      correlationHeader: X-Correlation-Id
      traceHeader: X-Trace-Id
      userAgent: customer-management-service
  jackson: # Configure the Jackson here 
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
      pretty-print: false
      fail-on-empty-beans: true
    deserialization:
      fail-on-unknown-properties: true
      accept-empty-string-as-null: false
      accept-single-value-as-array: false
      read-unknown-enum-values-as-null: false
    inclusion:
      value: NON_NULL
      null-value-handling: SET
      content: ALWAYS
    naming:
      strategy: LOWER_CAMEL_CASE

filter:
  mdc: # MDC configuration
    enabled: true 
    correlation:
      header: X-Correlation-Id 
      mdcKey: correlationId 
      acceptIncoming: true 
      generateIfMissing: true
    trace:
      header: X-Trace-Id 
      mdcKey: traceId 
      acceptIncoming: true 
      generateIfMissing: true
    response:
      includeCorrelationId: true 
      includeTraceId: true
    validation:
      maxIdLength: 128
  request-logging: # Request logging configuration
    enabled: true 
    includeQueryString: true 
    includeCorrelationId: true 
    includeTraceId: true 
    includeDuration: true 

# Event configuration (RabbitMQ for now)
event:
  rabbitmq:
    enabled: true
    exchange:
      name: customer.events
      type: topic
      durable: true
      auto-delete: false
    customer-events:
      name: customer.events.queue
      durable: true
      exclusive: false
      auto-delete: false
      routing-key: customer.*
    publisher:
      enabled: true
      confirms: true
      returns: true
    consumer:
      enabled: false
      concurrency: 1
      max-concurrency: 5
      prefetch: 10
      acknowledgement-mode: manual
    retry:
      enabled: true
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
      dead-letter-enabled: true
      dead-letter-exchange: customer.events.dlx
      dead-letter-queue: customer.events.dlq

# Outbox configuration
outbox:
  pollIntervalMs: ${OUTBOX_POLL_INTERVAL_MS:2000}
  batchSize: ${OUTBOX_BATCH_SIZE:50}
  maxRetries: ${OUTBOX_MAX_RETRIES:10}

# API configuration
api:
  version: v1 
  customer:
    basePath: /api/v1/customers 