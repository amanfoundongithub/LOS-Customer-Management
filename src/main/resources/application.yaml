spring:
  application:
    name: customer-management-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/customer_management}
    database: ${MONGODB_DATABASE:customer_management}
    representation:
      uuid: standard
  data:
    mongodb:
        auto-index-creation: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 1
        max-concurrency: 5
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /customer-management
customer-management:
  customer-number:
    prefix: CUST
    length: 10
rabbitmq:
  customer:
    exchange: los.customer.exchange
    routing-keys:
      customer-created: customer.created
      customer-updated: customer.updated
      customer-status-changed: customer.status.changed
      customer-address-changed: customer.address.changed
      customer-identification-changed: customer.identification.changed
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-retries: ${OUTBOX_MAX_RETRIES:10}
api:
  endpoint:
    customer:
      url: /api/v1/customers
    health:
      url: /api/v1/health
logging:
  level:
    root: INFO
    com.loan_org.customer_management: INFO
    org.springframework.data.mongodb: INFO
    org.springframework.amqp: INFO
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
  endpoint:
    health:
      show-details: when_authorized
info:
  app:
    name: Customer Management Service
    description: Customer lifecycle and profile management service
    version: 0.0.1

# Application configuration 
config:

  jackson: # Configure the Jackson here 
    serialization:
      write-dates-as-timestamps: false
      write-dates-with-zone-id: false
      pretty-print: false
      fail-on-empty-beans: true
    deserialization:
      fail-on-unknown-properties: true
      accept-empty-string-as-null: false
      accept-single-value-as-array: false
      read-unknown-enum-values-as-null: false
    inclusion:
      value: NON_NULL
      null-value-handling: SET
      content: ALWAYS
    naming:
      strategy: LOWER_CAMEL_CASE
  
  mdc: # MDC configuration
    enabled: true 
    correlation:
      header: X-Correlation-Id 
      mdcKey: correlationId 
      acceptIncoming: true 
      generateIfMissing: true
    trace:
      header: X-Trace-Id 
      mdcKey: traceId 
      acceptIncoming: true 
      generateIfMissing: true
    response:
      includeCorrelationId: true 
      includeTraceId: true
    validation:
      maxIdLength: 128

  request-logging: # Request logging configuration
    enabled: true 
    includeQueryString: true 
    includeCorrelationId: true 
    includeTraceId: true 
    includeDuration: true 